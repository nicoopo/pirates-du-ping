# La mesure de la flotte, à superposer au compose de production :
#   docker compose -f compose.prod.yml -f compose.mesure.yml up -d
# Même projet, donc même réseau : Prometheus résout front, api et annexe par leur nom.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./mesure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      # admin/admin par défaut si GRAFANA_PASSWORD est vide : inutilisable, login et API désactivés ci-dessous.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Lecture seule sans compte : l'astreinte garde le dashboard ouvert sans se connecter.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Grafana est joignable par toute la salle : aucune connexion possible, ni formulaire ni API.
      # Le dashboard vient du repo, on le modifie par une PR, pas dans le navigateur.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/flotte.json
    volumes:
      - ./mesure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./mesure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
