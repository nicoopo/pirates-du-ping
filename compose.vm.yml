# Infrastructure locale. La flotte aura son propre compose.prod.yml.
services:
  vm-prod:
    build:
      context: .
      dockerfile: infra/vm-prod/Dockerfile.vm
    container_name: vm-prod
    # Nécessaire pour faire tourner Docker dans Docker dans cette maquette.
    privileged: true
    ports:
      - "127.0.0.1:2222:22"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:9090:9090"
      # Grafana ouvert au réseau local : toute l'équipe suit la flotte depuis son poste (lecture seule).
      - "3001:3001"
    volumes:
      - type: bind
        source: ./deploy_key.pub
        target: /run/deploy_key.pub
        read_only: true
        bind:
          create_host_path: false
      - vm_docker:/var/lib/docker
      - vm_flotte:/srv/flotte
      - vm_ssh:/etc/ssh
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 && nc -z 127.0.0.1 22"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  vm_docker:
  vm_flotte:
  vm_ssh:
