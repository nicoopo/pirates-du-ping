name: Livraison vers vm-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'SHA déjà publié pour un retour arrière (vide = construire ce commit)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: livraison-vm-prod
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [front, api, annexe]
    steps:
      - uses: actions/checkout@v6
      - name: Nom de l'image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.image_tag != ''))
    runs-on: [self-hosted, macOS, ARM64, flotte-deploy]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Préparer les fichiers et livrer
        shell: bash
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          DEPLOY_REGISTRY_USER: ${{ github.actor }}
          DEPLOY_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          delivery_dir=$(mktemp -d "$RUNNER_TEMP/flotte-deploy.XXXXXX")
          trap 'rm -rf "$delivery_dir"' EXIT
          export DEPLOY_KEY="$delivery_dir/key"
          export DEPLOY_KNOWN_HOSTS="$delivery_dir/known_hosts"
          export DEPLOY_ENV_FILE="$delivery_dir/.env"
          printf '%s\n' "$SSH_KEY" > "$DEPLOY_KEY"
          printf '%s\n' "$SSH_HOSTS" > "$DEPLOY_KNOWN_HOSTS"
          test -n "$PROD_ENV"
          image_tag="${REQUESTED_TAG:-$COMMIT_SHA}"
          if ! [[ "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Le tag doit être un SHA complet de 40 caractères hexadécimaux.' >&2
            exit 1
          fi
          image_prefix=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          # Retirer les anciennes références locales pour livrer exactement ce SHA.
          printf '%s\n' "$PROD_ENV" | sed -E '/^(TAG|VERSION|FRONT_IMAGE|API_IMAGE|ANNEXE_IMAGE)=/d' > "$DEPLOY_ENV_FILE"
          {
            printf 'TAG=%s\nVERSION=%s\n' "$image_tag" "$image_tag"
            printf 'FRONT_IMAGE=ghcr.io/%s-front:%s\n' "$image_prefix" "$image_tag"
            printf 'API_IMAGE=ghcr.io/%s-api:%s\n' "$image_prefix" "$image_tag"
            printf 'ANNEXE_IMAGE=ghcr.io/%s-annexe:%s\n' "$image_prefix" "$image_tag"
          } >> "$DEPLOY_ENV_FILE"
          sh scripts/deploy.sh
