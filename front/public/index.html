<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buzzer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 1.5rem 1rem; display: flex; justify-content: center; }
    main { width: 100%; max-width: 420px; text-align: center; }
    input { width: 100%; box-sizing: border-box; padding: .6rem; font-size: 1rem; border-radius: 8px; border: none; }
    #buzz { margin: 1.5rem auto; width: 200px; height: 200px; border-radius: 50%; border: none; font-size: 2rem; font-weight: 800; background: #e05252; color: #fff; cursor: pointer; box-shadow: 0 8px 0 #8b2f2f; }
    #buzz:active { transform: translateY(6px); box-shadow: 0 2px 0 #8b2f2f; }
    section { background: #1f2937; border-radius: 10px; padding: .75rem 1rem; margin-top: 1rem; text-align: left; }
    .indispo { color: #fbbf24; }
    small { color: #9ca3af; }
  </style>
</head>
<body>
  <main>
    <h1>Buzzer</h1>
    <input id="joueur" maxlength="30" placeholder="Ton pseudo">
    <button id="buzz">BUZZ</button>
    <p id="message" role="status"></p>

    <section>
      <h2>Manche <span id="manche">–</span></h2>
      <ol id="ordre"></ol>
    </section>
    <section>
      <h2>Classement</h2>
      <ol id="stats"></ol>
      <small>calculé par le service annexe</small>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
